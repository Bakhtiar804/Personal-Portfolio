<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakhtiar Ahmed-Contact</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    
</head>

<body>

    <header>
        <div class="parent">
            <div class="home-icon" onclick="homeRedirect()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="var(--token-182ee8b3-4984-4a8e-9e60-5c8c5b4cb4cf, rgb(255, 255, 255))" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <div onclick="projectRedirect()" class="project-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="var(--token-182ee8b3-4984-4a8e-9e60-5c8c5b4cb4cf, rgb(255, 255, 255))" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div onclick="experienceRedirect()" class="experience-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="var(--token-182ee8b3-4984-4a8e-9e60-5c8c5b4cb4cf, rgb(255, 255, 255))" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
            <!-- <a href="#tools">  -->
            <div id="tools-icon" onclick="toolsRedirect()" class="tools-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="var(--token-182ee8b3-4984-4a8e-9e60-5c8c5b4cb4cf, rgb(255, 255, 255))" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                    </path>
                </svg>
            </div>
            <!-- </a> -->

            <div class="thoughts-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="var(--token-182ee8b3-4984-4a8e-9e60-5c8c5b4cb4cf, rgb(255, 255, 255))" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </div>
        </div>
    </header>
    <div id="main-contact">
        <div class="container-contact">
            <h1 id="title" class="title">Let's Work <span class="muted">Together</span></h1>
            <form onclick="event.preventDefault()" id="contact-form" class="contact-form">
                <div class="row">
                    <div>
                        <label for="name">Name</label>
                        <input id="name" type="text" placeholder="Your Name" />
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input id="email" type="email" placeholder="Your@email.com" />
                    </div>
                </div>
                <div class="dropDown">
                    <label for="service">Service</label>
                    <select id="service">
                        <option value="">Select...</option>
                        <option value="1">Web Design</option>
                        <option value="2">Web Development</option>
                        <option value="3">Other</option>
                    </select>
                </div>
                <div class="message-inp">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Message"></textarea>
                </div>
                <button id="submit-btn" type="submit">Submit</button>
            </form>
        </div>
    </div>
    
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: 'h5FXPm02qcb95Mu3c',
            });
        })();
    </script>
    <script src="app.js"></script>
</body>

</html>
